[pytest]
addopts =
    --doctest-modules
    --doctest-continue-on-failure
    --pyargs
    --showlocals
    -vv
    -p pytest_wsjrdp2027
    # --capture=no

norecursedirs =
    .claude
    2023
    build
    data
    dist
    integration-tests

log_level = DEBUG

