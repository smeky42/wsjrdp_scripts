from_addr: anmeldung@worldscoutjamboree.de
# Sender and Bcc come from Hitobito (deregistration.mail), and so do the role,
# the name, the ticket, the deadline and who signs (create_deregistration_form.py).
email_subject: "WSJ27 Abmeldung {{ deregistration.role_id_name }}{% if deregistration.issue %} {{ deregistration.issue }}{% endif %}"
signature: "{{ EMAIL_SIGNATURE_DAVID_FRITZSCHE }}"
content: |
  {% for name in deregistration.contract_names %}Hallo {{ name }}{% if not loop.last %}, {% endif %}{% endfor %},

  {% set num_names = deregistration.contract_names | length %}schade, dass {% if num_names > 1 %}{{ row.greeting_name }}{% else %}Du{% endif %} nicht mit zum Jamboree {% if num_names > 1 %}kommt{% else %}kommst{% endif %}. Um die Abmeldung vornehmen zu können, benötigen wir das angehängte Abmeldungs-Formular unterschreiben zurück. {% if num_names > 1 %}Bitte schickt{% else %}Bitte schick{% endif %} es uns bis zum {{ reply_due_date_de }} per E-Mail zurück.{% if deregistration.status in ["deregistration_noted", "deregistered"] %} Wir haben die Abmeldung auch schon im Anmeldesystem vermerkt.{% endif %} Wenn wir das unterschriebene Formular fristgerecht per E-Mail zurück erhalten haben, veranlassen wir die Rückzahlung, setzen wir die Registrierung auf Abgemeldet und {% if num_names > 1 %}ihr bekommt für eure{% else %}du bekommst für deine{% endif %} Unterlagen eine Bestätigung der Abmeldung.

  Liebe Grüße und Gut Pfad
  Daffi
